name: Python Project Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  basic-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: action/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python files
        run: python -m compileall -q .
